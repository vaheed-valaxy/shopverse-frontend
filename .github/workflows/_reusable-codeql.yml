name: Reusable - CodeQL Analysis

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service Name"
        required: true
        type: string
      
      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest
        
jobs:
  Codeql-Analysis-Job:
    name: CodeQL 
    runs-on: ${{ inputs.runner }}
    
    permissions:
      contents: read  
      security-events: write
      actions: read

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # Initialize CodeQL
      # ============================================================
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none

      # ============================================================
      # Analyze (Uploads sarif report to Github Security Tab)
      # ============================================================
      
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"


      # ------------------------------------------------
      # ** Enforce CODEQL security policy **
      # ------------------------------------------------
      - name: Enforce CodeQL Security Policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking CodeQL security findings..."

          alerts=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/code-scanning/alerts" \
            --paginate)

          high=$(echo "$alerts" | jq '
            [
              .[]
              | select(
                  .state == "open"
                  and
                  .tool.name == "CodeQL"
                  and
                  (
                    .rule.security_severity_level == "high"
                    or
                    .rule.security_severity_level == "critical"
                  )
              )
            ]
            | length
          ')

          echo "High/Critical CodeQL findings: $high"

          if [ "$high" -gt 0 ]; then
            echo "❌ High/Critical CodeQL vulnerabilities found."
            exit 1
          fi

          echo "✅ No High/Critical CodeQL vulnerabilities found."

          echo "High/Critical CodeQL findings: $high"

          if [ "$high" -gt 0 ]; then
            echo "❌ High/Critical CodeQL vulnerabilities found."
            exit 1
          fi

          echo "✅ No High/Critical CodeQL vulnerabilities found."
