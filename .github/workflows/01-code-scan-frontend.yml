name: Code - Scan — Frontend

on:
  workflow_dispatch:

  push:
    branches:
      - 'feat-*'
      - 'fix-*'
      - 'chore-*'
    paths:
      - 'backend/**'
      - '.github/workflows/01-code-scan-frontend.yml'
      
# ============================================================
# ONE PLACE TO CHANGE PER SERVICE
# ============================================================

env:
  SERVICE_NAME: frontend
  TARGET_BRANCH: develop

jobs:

  # ==========================================================
  # JOB 1 — Read workflow configuration
  # ==========================================================

  Config-Job:
    name: Load workflow configuration
    runs-on: ubuntu-latest

    outputs:
      service_name: ${{ steps.config.outputs.service_name }}
      target_branch: ${{ steps.config.outputs.target_branch }}

    steps:
      - name: Validate Branch name
        run: |
          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          
          if [[ ! "${SOURCE_BRANCH}" =~ ^(feat|fix|chore)- ]]; then
            echo "ERROR: Unsupported branch '${SOURCE_BRANCH}'."
            echo "Expected branch pattern: (to run workflow)."
            echo "  feat-*"
            echo "  fix-*"
            echo "  chore-*"

            exit 1
          fi
      
      - name: Export configuration
        id: config
        run: |
          echo "SERVICE_NAME=${SERVICE_NAME}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}"
          
          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

  # ==========================================================
  # JOB 2 — Code / Security scans
  # ==========================================================

  Code-Scan-Job:
    needs: Config-Job

    uses: ./.github/workflows/_node-code-scan.yml

    permissions:
      contents: read
      security-events: write
      actions: read   # CodeQL Analysis

    with:
      service-name: ${{ needs.Config-Job.outputs.service_name }}
      runner: ubuntu-latest

      gitleaks-scan: true
      
      eslint-scan: true

      trivy-fs-scan: false
      trivy-fs-scan-path: "."
      trivy-fs-skip-files: '**/README.md,**/LICENSE,**/docs/**'

      codeql-scan: false

      sonarqube-scan: false
      # sonar-host-url: ${{ vars.SONAR_HOST_URL }}

    # secrets:
    #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    

  # ==========================================================
  # JOB 3 — Create PR
  # ==========================================================

  Create-PR-Job:
    name: Create PR to develop branch
    runs-on: ubuntu-latest

    needs:
      - Config-Job
      - Code-Scan-Job

    permissions:
      contents: read
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      SVC: ${{ needs.Config-Job.outputs.service_name }}
      ACTOR: ${{ github.actor }}
      SERVER_URL: ${{ github.server_url }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}

    steps:

      - name: Create Pull Request
        run: |

          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          TARGET_BRANCH="${{ needs.Config-Job.outputs.target_branch }}"
          
          echo "=================================================="
          echo "Creating Pull Request"
          echo "--------------------------------------------------"
          echo "Service       : ${SVC}"
          echo "Source Branch : ${SOURCE_BRANCH}"
          echo "Target Branch : develop"
          echo "=================================================="

          # --------------------------------------------------
          # Validate branch name
          # --------------------------------------------------

          if [[ ! "${SOURCE_BRANCH}" =~ ^(feat|fix|chore)- ]]; then

            echo "ERROR: Unsupported branch '${SOURCE_BRANCH}'."
            echo "Expected branch pattern: (to run workflow)"
            echo "  feat-*"
            echo "  fix-*"
            echo "  chore-*"

            exit 1

          fi

          # --------------------------------------------------
          # Check whether a PR already exists
          # --------------------------------------------------

          EXISTING_PR=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${SOURCE_BRANCH}" \
            --base "${TARGET_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          # --------------------------------------------------
          # If PR already exists, do nothing
          # --------------------------------------------------

          if [ -n "${EXISTING_PR}" ]; then
            echo "PR #${EXISTING_PR} already exists."
            echo "Nothing to do."
            exit 0
          fi

          # --------------------------------------------------
          # Create new PR
          # --------------------------------------------------
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${SOURCE_BRANCH}" \
            --base develop \
            --title "PR: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}" \
            --body "$(cat <<EOF
          ## Automated Pull Request

          This PR was automatically created after all pre-PR security checks passed.

          **Service:** \`${SVC}\`
          **Proposed By:** \`${ACTOR}\`
          **Source branch:** \`${SOURCE_BRANCH}\`
          **Target branch:** \`develop\`
          **Workflow run:** ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID} 

          ### Security checks passed

          - ✔️ Gitleaks  
          - ✔️ ES Lint
          - ✔️ CodeQL  
          - ✔️ Trivy Filesystem  
          - 🚫 SonarQube: Not enabled  

          ### Next step:

          **After this PR is reviewed and merged into \`develop\`**,
          >***- The backend CI workflow will build, scan, publish, sign and generate the SBOM for the application image.***
          >***- Will automatically do the DEV deployment***.
          EOF
          )"
